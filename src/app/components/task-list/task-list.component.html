<!-- task-list.component.html -->
<div class="task-list-container">
  <div class="section-header">
    <h2 class="section-title">Today's Tasks</h2>
    <button class="btn-add-task" (click)="addNewTask()">
      <span class="plus-icon">+</span>
    </button>
  </div>
  
  <div class="tasks">
    <!-- New Task Input (shown when adding) -->
    <div *ngIf="isAddingTask" class="task-item new-task" [@taskAnimation] [@editAnimation]="'editing'">
      <div class="task-info">
        <div class="task-title-edit">
          <input 
            id="newTaskInput"
            type="text" 
            class="task-title-input" 
            placeholder="What are you working on?"
            [(ngModel)]="newTaskTitle"
            (keydown)="onTaskInputKeydown($event)"
            (blur)="onTaskInputBlur()"
            autofocus
          >
        </div>
        <div class="task-tags">
          <span class="tag hint-tag">Press Enter to add task</span>
        </div>
      </div>
      
      <div class="task-controls">
        <button class="btn btn-start" (click)="saveNewTask()">Add</button>
        <div class="task-duration">0m</div>
      </div>
    </div>
    
    <!-- Task List -->
    <app-task-item 
      *ngFor="let task of tasks" 
      [task]="task">
    </app-task-item>
    
    <!-- Empty state when no tasks -->
    <div *ngIf="tasks.length === 0 && !isAddingTask" class="empty-state">
      <p>No tasks for today. Click the + button to add a task.</p>
    </div>
  </div>
</div>
