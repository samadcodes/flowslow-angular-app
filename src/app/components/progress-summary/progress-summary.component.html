<!-- src/app/components/progress-summary/progress-summary.component.html -->
<div class="progress-summary card" *ngIf="progressStats">
  <h2 class="title">Today's Progress</h2>
  
  <div class="summary-row">
    <div class="main-stat">
      <div class="stat-value">{{ progressStats.totalTime }}</div>
      <div class="stat-label">Total time</div>
    </div>
    <div class="main-counter">
      <div class="counter-value">{{ progressStats.tasksCompleted }}</div>
      <div class="counter-label">Tasks</div>
    </div>
  </div>
  
  <div class="details-row">
    <div class="stat-item">
      <div class="stat-value productive">{{ progressStats.productiveTime }}</div>
      <div class="stat-label">Productive</div>
    </div>
    <div class="stat-item">
      <div class="stat-value break">{{ progressStats.breakTime }}</div>
      <div class="stat-label">Break</div>
    </div>
  </div>
</div>
