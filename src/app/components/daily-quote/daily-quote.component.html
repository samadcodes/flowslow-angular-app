<div class="daily-quote card" *ngIf="quote">
    <div class="quote-content">
        <span class="quote-mark">"</span>
        {{ quote.text }}
        <span class="quote-mark">"</span>
        <span class="quote-author" *ngIf="quote.author"> – {{ quote.author }}</span>
    </div>
</div>
