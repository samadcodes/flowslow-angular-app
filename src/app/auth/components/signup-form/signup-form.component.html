<form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
        <label for="username">username</label>
        <input type="text" id="username" formControlName="username" placeholder="choose a username"
            [class.error]="showErrors('username')">
        <div class="error-message" *ngIf="showErrors('username')">
            username is required (min 3 characters)
        </div>
    </div>

    <div class="form-group">
        <label for="email">email</label>
        <input type="email" id="email" formControlName="email" placeholder="your email address"
            [class.error]="showErrors('email')">
        <div class="error-message" *ngIf="showErrors('email')">
            <span *ngIf="signupForm.get('email')?.errors?.['required']">
                email is required
            </span>
            <span *ngIf="signupForm.get('email')?.errors?.['email']">
                please enter a valid email
            </span>
        </div>
    </div>

    <div class="form-group">
        <label for="password">password</label>
        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
            placeholder="create a password" [class.error]="showErrors('password')">
        <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            {{ showPassword ? 'hide' : 'show' }}
        </button>
        <div class="error-message" *ngIf="showErrors('password')">
            password must be at least 8 characters
        </div>
    </div>

    <div class="form-group">
        <label for="confirmPassword">confirm password</label>
        <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword"
            placeholder="confirm your password" [class.error]="showErrors('confirmPassword')">
        <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
            {{ showConfirmPassword ? 'hide' : 'show' }}
        </button>
        <div class="error-message" *ngIf="showPasswordMismatchError()">
            passwords don't match
        </div>
    </div>

    <div class="form-group terms">
        <label class="checkbox-container">
            <input type="checkbox" formControlName="agreeTerms">
            <span class="checkmark"></span>
            <span class="label-text">
                i agree to the <a href="#">terms of service</a> and <a href="#">privacy policy</a>
            </span>
        </label>
        <div class="error-message" *ngIf="showErrors('agreeTerms')">
            you must agree to the terms
        </div>
    </div>

    <div class="error-message auth-error" *ngIf="authError">
        {{ authError }}
    </div>

    <button type="submit" class="btn-submit" [disabled]="signupForm.invalid || isSubmitting">
        {{ isSubmitting ? 'creating account...' : 'sign up' }}
    </button>
</form>
